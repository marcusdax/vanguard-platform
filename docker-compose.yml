services:
  postgres:
    image: postgres:16-alpine
    container_name: vanguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard_dev_password_2026
      POSTGRES_DB: vanguard_db
    ports:
      - "5436:5432"
    volumes:
      - vanguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard -d vanguard_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vanguard-redis
    restart: unless-stopped
    ports:
      - "6386:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vanguard-mediamtx
    restart: unless-stopped
    ports:
      - "1937:1935"
      - "8898:8888"
      - "8899:8889"

  vision:
    build:
      context: ./services/vision
    container_name: vanguard-vision
    restart: unless-stopped
    environment:
      UPLOADS_DIR: /app/uploads
    volumes:
      - vanguard_uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    container_name: vanguard-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://vanguard:vanguard_dev_password_2026@postgres:5432/vanguard_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: vanguard-standalone-dev-jwt-secret-change-in-prod-2026
      JWT_REFRESH_SECRET: vanguard-standalone-dev-refresh-secret-change-in-prod-2026
      VISION_SERVICE_URL: http://vision:8000
      FRONTEND_URL: http://localhost:3200
      ALLOW_TUNNEL_CORS: "true"
    ports:
      - "5200:5000"
    volumes:
      - vanguard_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
    container_name: vanguard-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vanguard_pg_data:
  vanguard_uploads:
